<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>

<body
  style="font-family: Arial, sans-serif; background: #ffffff; color: #000000; padding: 40px; max-width: 400px; margin: 0 auto;">

  <h2>Login</h2>

  <div id="loginSection">
    <div style="margin-bottom: 15px;">
      <label>Email:</label><br>
      <input type="email" id="email" style="width: 100%; padding: 8px; margin-top: 4px;" required>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Password:</label><br>
      <input type="password" id="password" style="width: 100%; padding: 8px; margin-top: 4px;" required>
    </div>

    <button onclick="handleLogin()" style="padding: 8px 16px; cursor: pointer;">Login</button>

    <p style="margin-top: 20px; font-size: 14px;">
      Don't have an account? <a href="/register.html">Register</a> | <a href="/dashboard.html">Back to Dashboard</a>
    </p>

    <p id="message" style="margin-top: 15px; font-size: 14px;"></p>
  </div>

  <script>
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msgEl = document.getElementById('message');
      msgEl.style.color = '#000000';
      msgEl.innerText = 'Logging in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem('auth_token', data.token);
          window.location.href = '/dashboard.html';
        } else {
          msgEl.style.color = 'red';
          msgEl.innerText = data.message || 'Login failed.';
        }
      } catch (err) {
        msgEl.style.color = 'red';
        msgEl.innerText = 'Network error: ' + err.message;
      }
    }
  </script>
</body>

</html>
