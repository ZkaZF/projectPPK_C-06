<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>

<body
  style="font-family: Arial, sans-serif; background: #ffffff; color: #000000; padding: 40px; max-width: 400px; margin: 0 auto;">

  <h2>Login</h2>

  <div id="loginSection">
    <div style="margin-bottom: 15px;">
      <label>Email:</label><br>
      <input type="email" id="email" style="width: 100%; padding: 8px; margin-top: 4px;" required>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Password:</label><br>
      <input type="password" id="password" style="width: 100%; padding: 8px; margin-top: 4px;" required>
    </div>

    <button onclick="handleLogin()" style="padding: 8px 16px; cursor: pointer;">Login</button>

    <p style="margin-top: 20px; font-size: 14px;">
      Don't have an account? <a href="/register.html">Register</a>
    </p>

    <p id="message" style="margin-top: 15px; font-size: 14px;"></p>
  </div>

  <div id="userSection" style="display: none;">
    <p>Welcome, <b id="userName"></b>!</p>
    <p>Role: <span id="userRole"></span></p>
    <p>Status: <span id="userStatus"></span></p>
    <button onclick="handleLogout()" style="padding: 8px 16px; cursor: pointer;">Logout</button>
  </div>

  <script>
    const token = localStorage.getItem('auth_token');

    // If already logged in, check profile
    if (token) {
      fetch('/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
      })
        .then(res => res.json())
        .then(data => {
          if (data.user) {
            showLoggedIn(data.user);
          } else {
            localStorage.removeItem('auth_token');
          }
        })
        .catch(() => localStorage.removeItem('auth_token'));
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msgEl = document.getElementById('message');
      msgEl.style.color = '#000000';
      msgEl.innerText = 'Logging in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem('auth_token', data.token);
          showLoggedIn(data.user);
        } else {
          msgEl.style.color = 'red';
          msgEl.innerText = data.message || 'Login failed.';
        }
      } catch (err) {
        msgEl.style.color = 'red';
        msgEl.innerText = 'Network error: ' + err.message;
      }
    }

    function showLoggedIn(user) {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('userSection').style.display = 'block';
      document.getElementById('userName').innerText = user.full_name;
      document.getElementById('userRole').innerText = user.role ? user.role.role_name : '-';
      document.getElementById('userStatus').innerText = user.user_status ? user.user_status.u_status_name : '-';
    }

    async function handleLogout() {
      const activeToken = localStorage.getItem('auth_token');
      if (activeToken) {
        await fetch('/api/auth/logout', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + activeToken, 'Accept': 'application/json' }
        });
      }
      localStorage.removeItem('auth_token');
      window.location.reload();
    }
  </script>
</body>

</html>
