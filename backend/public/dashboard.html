<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
</head>

<body style="font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto;">

  <div id="header">
    <b id="welcomeText">Loading...</b>
    <button onclick="handleLogout()" style="float: right; padding: 6px 12px; cursor: pointer;">Logout</button>
    <hr>
  </div>

  <!-- Facilities List -->
  <h3>Facilities</h3>
  <div>
    <label>Filter Type:</label>
    <select id="filterType" onchange="loadFacilities()">
      <option value="">All</option>
      <option value="ruang_kelas">Ruang Kelas</option>
      <option value="aula">Aula</option>
      <option value="laboratorium">Laboratorium</option>
      <option value="alat">Alat</option>
      <option value="lapangan">Lapangan</option>
    </select>
    <label style="margin-left: 10px;">Location:</label>
    <input type="text" id="filterLocation" placeholder="search..." onkeyup="loadFacilities()">
  </div>
  <br>
  <table border="1" cellpadding="6" cellspacing="0" width="100%" id="facilityTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Location</th>
        <th>Capacity</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="facilityBody">
      <tr>
        <td colspan="7">Loading...</td>
      </tr>
    </tbody>
  </table>

  <hr>

  <!-- Check Slots -->
  <h3>Check Time Slots</h3>
  <label>Facility ID:</label>
  <input type="number" id="slotFacId" value="1" style="width: 60px;">
  <label style="margin-left: 10px;">Date:</label>
  <input type="date" id="slotDate">
  <button onclick="loadSlots()" style="margin-left: 10px; padding: 4px 10px; cursor: pointer;">Load Slots</button>
  <div id="slotsResult" style="margin-top: 10px;"></div>

  <hr>

  <!-- Add Facility (admin only) -->
  <div id="adminSection" style="display: none;">
    <h3>Add New Facility (Admin)</h3>
    <div style="margin-bottom: 8px;">
      <label>Name:</label><br>
      <input type="text" id="addName" style="width: 100%;">
    </div>
    <div style="margin-bottom: 8px;">
      <label>Type:</label><br>
      <select id="addType">
        <option value="1">Ruang Kelas</option>
        <option value="2">Aula</option>
        <option value="3">Laboratorium</option>
        <option value="4">Alat</option>
        <option value="5">Lapangan</option>
      </select>
    </div>
    <div style="margin-bottom: 8px;">
      <label>Location:</label><br>
      <input type="text" id="addLocation" style="width: 100%;">
    </div>
    <div style="margin-bottom: 8px;">
      <label>Capacity (optional):</label><br>
      <input type="number" id="addCapacity">
    </div>
    <div style="margin-bottom: 8px;">
      <label>Description (optional):</label><br>
      <textarea id="addDescription" style="width: 100%;"></textarea>
    </div>
    <div style="margin-bottom: 8px;">
      <label>Status:</label><br>
      <select id="addStatus">
        <option value="1">Aktif</option>
        <option value="2">Dalam Perbaikan</option>
        <option value="3">Nonaktif</option>
      </select>
    </div>
    <button onclick="addFacility()" style="padding: 6px 14px; cursor: pointer;">Create Facility</button>
    <p id="addResult"></p>
  </div>

  <!-- Response Viewer -->
  <hr>
  <h3>Last API Response</h3>
  <pre id="responseBox"
    style="background: #f4f4f4; border: 1px solid #ccc; padding: 10px; white-space: pre-wrap; max-height: 300px; overflow-y: auto;">No response yet.</pre>

  <script>
    const token = localStorage.getItem('auth_token');

    // Redirect to login if no token
    if (!token) {
      window.location.href = '/login.html';
    }

    // Set today's date as default for slot checker
    document.getElementById('slotDate').value = new Date().toISOString().split('T')[0];

    // Load user info
    fetchApi('/api/auth/me').then(data => {
      if (data && data.user) {
        const u = data.user;
        const role = u.role ? u.role.role_name : (u.role_name || '-');
        document.getElementById('welcomeText').innerText =
          'Welcome, ' + (u.full_name) + ' | Role: ' + role;

        // Show admin section if admin
        if (role === 'admin') {
          document.getElementById('adminSection').style.display = 'block';
        }
      } else {
        localStorage.removeItem('auth_token');
        window.location.href = '/login.html';
      }
    });

    // Load facilities on page load
    loadFacilities();

    // ─── API Helper ────────────────────────────────────
    async function fetchApi(url, options = {}) {
      const headers = {
        'Accept': 'application/json',
        'Authorization': 'Bearer ' + token,
        ...options.headers
      };
      try {
        const res = await fetch(url, { ...options, headers });
        const data = await res.json();
        document.getElementById('responseBox').innerText =
          'HTTP ' + res.status + '\n' + JSON.stringify(data, null, 2);
        return data;
      } catch (err) {
        document.getElementById('responseBox').innerText = 'Error: ' + err.message;
        return null;
      }
    }

    // ─── Facilities ────────────────────────────────────
    async function loadFacilities() {
      const type = document.getElementById('filterType').value;
      const location = document.getElementById('filterLocation').value;
      let url = '/api/facilities?';
      if (type) url += 'type=' + type + '&';
      if (location) url += 'location=' + location + '&';

      const data = await fetchApi(url);
      const tbody = document.getElementById('facilityBody');

      if (!data || !data.data || data.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7">No facilities found.</td></tr>';
        return;
      }

      tbody.innerHTML = data.data.map(f => `
        <tr>
          <td>${f.fac_id}</td>
          <td>${f.fac_name}</td>
          <td>${f.type ? f.type.fac_type_name : '-'}</td>
          <td>${f.fac_location}</td>
          <td>${f.fac_capacity || '-'}</td>
          <td>${f.status ? f.status.fac_status_name : '-'}</td>
          <td><button onclick="document.getElementById('slotFacId').value=${f.fac_id}; loadSlots();" style="cursor:pointer;">Slots</button></td>
        </tr>
      `).join('');
    }

    // ─── Slots ─────────────────────────────────────────
    async function loadSlots() {
      const facId = document.getElementById('slotFacId').value;
      const date = document.getElementById('slotDate').value;
      const data = await fetchApi('/api/facilities/' + facId + '/slots?date=' + date);
      const container = document.getElementById('slotsResult');

      if (!data || !data.slots) {
        container.innerHTML = '<p>Could not load slots.</p>';
        return;
      }

      let html = '<table border="1" cellpadding="4" cellspacing="0"><tr><th>Time</th><th>Status</th></tr>';
      data.slots.forEach(s => {
        const color = s.status === 'available' ? 'green' : 'red';
        html += `<tr><td>${s.start} - ${s.end}</td><td style="color:${color}; font-weight:bold;">${s.status}</td></tr>`;
      });
      html += '</table>';
      container.innerHTML = html;
    }

    // ─── Add Facility ──────────────────────────────────
    async function addFacility() {
      const body = {
        fac_name: document.getElementById('addName').value,
        fac_type_id: parseInt(document.getElementById('addType').value),
        fac_location: document.getElementById('addLocation').value,
        fac_capacity: document.getElementById('addCapacity').value ? parseInt(document.getElementById('addCapacity').value) : null,
        fac_description: document.getElementById('addDescription').value || null,
        fac_stat_id: parseInt(document.getElementById('addStatus').value),
        fac_image: null,
      };

      const data = await fetchApi('/api/facilities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const resultEl = document.getElementById('addResult');
      if (data && data.message) {
        resultEl.style.color = 'green';
        resultEl.innerText = data.message;
        loadFacilities(); // refresh table
      } else {
        resultEl.style.color = 'red';
        resultEl.innerText = 'Failed. Check API response below.';
      }
    }

    // ─── Logout ────────────────────────────────────────
    async function handleLogout() {
      await fetchApi('/api/auth/logout', { method: 'POST' });
      localStorage.removeItem('auth_token');
      window.location.href = '/login.html';
    }
  </script>
</body>

</html>
