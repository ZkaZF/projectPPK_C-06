<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Register</title>
</head>

<body
  style="font-family: Arial, sans-serif; background: #ffffff; color: #000000; padding: 40px; max-width: 400px; margin: 0 auto;">

  <h2>Register</h2>

  <div id="registerForm">
    <div style="margin-bottom: 12px;">
      <label>Full Name:</label><br>
      <input type="text" id="full_name" style="width: 100%; padding: 8px; margin-top: 4px;" required>
    </div>

    <div style="margin-bottom: 12px;">
      <label>Email:</label><br>
      <input type="email" id="email" style="width: 100%; padding: 8px; margin-top: 4px;" required>
    </div>

    <div style="margin-bottom: 12px;">
      <label>NIM / NIP (optional):</label><br>
      <input type="text" id="nim_nip" style="width: 100%; padding: 8px; margin-top: 4px;">
    </div>

    <div style="margin-bottom: 12px;">
      <label>Password:</label><br>
      <input type="password" id="password" style="width: 100%; padding: 8px; margin-top: 4px;" required>
    </div>

    <div style="margin-bottom: 12px;">
      <label>Confirm Password:</label><br>
      <input type="password" id="password_confirmation" style="width: 100%; padding: 8px; margin-top: 4px;" required>
    </div>

    <button onclick="handleRegister()" style="padding: 8px 16px; cursor: pointer;">Register</button>

    <p style="margin-top: 20px; font-size: 14px;">
      Already have an account? <a href="/login.html">Login</a>
    </p>

    <p id="message" style="margin-top: 15px; font-size: 14px;"></p>
  </div>

  <script>
    async function handleRegister() {
      const full_name = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const nim_nip = document.getElementById('nim_nip').value.trim();
      const password = document.getElementById('password').value;
      const password_confirmation = document.getElementById('password_confirmation').value;

      const msgEl = document.getElementById('message');
      msgEl.style.color = '#000000';
      msgEl.innerText = 'Submitting registration...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            full_name,
            email,
            nim_nip,
            password,
            password_confirmation
          })
        });

        const data = await res.json();

        if (res.ok) {
          msgEl.style.color = 'green';
          msgEl.innerHTML = (data.message || 'Registration successful!') + '<br><br><a href="/login.html">Proceed to Login</a>';
        } else {
          msgEl.style.color = 'red';
          if (data.errors) {
            msgEl.innerText = Object.values(data.errors).flat().join(' ');
          } else {
            msgEl.innerText = data.message || 'Registration failed.';
          }
        }
      } catch (err) {
        msgEl.style.color = 'red';
        msgEl.innerText = 'Network error: ' + err.message;
      }
    }
  </script>
</body>

</html>
